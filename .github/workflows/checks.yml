name: checks

# 只在 push / PR 上跑守卫与测试。本仓库不产出对外产物，也不做自动发版——
# 沿用 example-client CONTRIBUTING §四 的分工：检查类 workflow
# 允许 push 触发，发布类一律手动。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 类型检查（strict）
        run: npm run typecheck

      - name: 单元与整合测试
        run: npm test

      # 静态导出是这个仓库唯一的对外产物。typecheck 与单测都过、导出却坏掉是
      # 可能的：Next 的打包器解析规则与 tsc 不是一回事（Next 16 换成 Turbopack
      # 缺省时就一次撞上 51 个 Can't resolve）。所以这一步单独跑。
      - name: 静态导出（EdgeOne Pages 的交付产物）
        run: npm run build -w @aio/station

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 jsonschema（跑完整 schema 校验）
        run: pip install --quiet jsonschema

      - name: 契约守卫自测（坏样本必须被拦下）
        run: python3 tools/test-check-sources.py

      - name: 契约守卫
        run: python3 tools/check-sources.py

  commit-messages:
    runs-on: ubuntu-latest
    steps:
      # 需要完整历史才能算出本次推送的提交范围。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # git 钩子只有在 core.hooksPath 指向 tools/githooks 之后才生效，而那是每份
      # 克隆的本地配置。2026-08-20 实测：多仓库远程会话里仓库自带的
      # .claude/settings.json 不是「项目设置」，那条自动接电的路径不成立，
      # 8 个提交一路无人拦。所以判据在这里再来一遍——CI 不依赖任何本地配置。
      - name: 提交信息守卫（不依赖本地钩子）
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/check-commit-messages.py \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}"
          else
            python3 tools/check-commit-messages.py \
              "${{ github.event.before }}" "${{ github.sha }}"
          fi

  assets:
    runs-on: ubuntu-latest
    steps:
      # 铁律 9 要查的是「有没有版权文件进过这棵树」，只看一个浅克隆的 HEAD
      # 是不够的——但至少要把当前树查干净。历史体检另见 tools/check-assets.py 的说明。
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 资源分离守卫自测（坏样本必须被拦下）
        run: python3 tools/test-check-assets.py

      - name: 清单生成器自测（失败路径必须真的失败）
        run: python3 tools/test-build-manifest.py

      - name: 资源与代码分离守卫（铁律 9）
        run: python3 tools/check-assets.py
