name: checks

# 只在 push / PR 上跑守卫与测试。本仓库不产出对外产物，也不做自动发版——
# 沿用 example-client CONTRIBUTING §四 的分工：检查类 workflow
# 允许 push 触发，发布类一律手动。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 类型检查（strict）
        run: npm run typecheck

      - name: 单元与整合测试
        run: npm test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 jsonschema（跑完整 schema 校验）
        run: pip install --quiet jsonschema

      - name: 契约守卫自测（坏样本必须被拦下）
        run: python3 tools/test-check-sources.py

      - name: 契约守卫
        run: python3 tools/check-sources.py

  assets:
    runs-on: ubuntu-latest
    steps:
      # 铁律 9 要查的是「有没有版权文件进过这棵树」，只看一个浅克隆的 HEAD
      # 是不够的——但至少要把当前树查干净。历史体检另见 tools/check-assets.py 的说明。
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 资源分离守卫自测（坏样本必须被拦下）
        run: python3 tools/test-check-assets.py

      - name: 资源与代码分离守卫（铁律 9）
        run: python3 tools/check-assets.py
