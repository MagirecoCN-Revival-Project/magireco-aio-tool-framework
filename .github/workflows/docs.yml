name: docs

# 文档站发布。**这是「发布类 workflow 一律手动」的一个有意的例外**
# （分工见 checks.yml 的注释与 example-client CONTRIBUTING §四）。
# 两条理由：
#
#   - 落后的文档比没有文档更糟——它会让人按一份不成立的描述去改代码；
#   - 与 APK 发版不同，文档发布是**幂等且可逆**的：没有版本号，没有用户在
#     安装什么东西，推错了改回来再推一次即可。
#
# 不接受这个判断的话，把下面的 `push:` 去掉就变回纯手动。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 只授出发布 Pages 所需的两项。默认的 contents: read 也一并写出来，
# 免得以后加了别的步骤时以为它有写权限。
permissions:
  contents: read
  pages: write
  id-token: write

# 连着推两次时，让后一次取消前一次——但**不取消已经在发布的那一步**，
# 否则站点可能停在半截状态。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # lastUpdated 取自 git 提交时间，浅克隆会让每一页都显示同一个时间。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 域名不入库（这套框架要能当模板用），从仓库变量取：
      # Settings → Secrets and variables → Actions → Variables → DOCS_DOMAIN。
      # 没设就跳过 CNAME，站点仍然能发到 *.github.io，只是没有自定义域名。
      - name: 构建文档站
        env:
          DOCS_ORIGIN: ${{ vars.DOCS_DOMAIN && format('https://{0}', vars.DOCS_DOMAIN) || '' }}
        run: |
          npm run docs:build
          if [ -n "${{ vars.DOCS_DOMAIN }}" ]; then
            printf '%s\n' "${{ vars.DOCS_DOMAIN }}" > docs/.vitepress/dist/CNAME
            echo "已写入自定义域名到产物的 CNAME"
          else
            echo "未设置 vars.DOCS_DOMAIN，跳过 CNAME"
          fi

      # 🔴 Pages 必须**先由人**在 Settings → Pages 把 Source 设成 GitHub Actions。
      # 2026-08-21 两次实测：
      #   不带 enablement → Get Pages site failed … Not Found
      #   带 enablement:true → Create Pages site failed … Resource not accessible
      #                        by integration
      # 也就是说 GITHUB_TOKEN 在本组织下无权创建 Pages 站点，自动不了。
      # enablement 留着不删：站点开好之后这一条是空操作（get 成功就不会去 create），
      # 而在权限更宽的 fork 里它能省掉那一步。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
